<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ember</title>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-phase="focus" data-status="idle">
    <main class="popup" id="timer-view">
      <header class="reveal">
        <span class="kicker" id="session-kicker">session 1 of 4</span>
        <h1 class="phase-word" id="phase-label">focus</h1>
      </header>

      <div class="time reveal" style="--d: 0.06s" id="time">25:00</div>

      <div class="bar reveal" style="--d: 0.1s">
        <div class="bar-fill" id="bar-fill"></div>
      </div>

      <div class="dots reveal" style="--d: 0.14s" id="dots"></div>

      <div class="controls reveal" style="--d: 0.18s">
        <button class="btn-primary" id="toggle">Start</button>
        <button class="btn-ghost" id="reset" title="Reset this phase">Reset</button>
        <button class="btn-ghost" id="skip" title="Skip to next phase">Skip</button>
      </div>

      <div class="extend reveal" id="extend" hidden>
        <button class="btn-ghost" data-extend="1">+1 min</button>
        <button class="btn-ghost" data-extend="5">+5 min</button>
      </div>

      <footer class="reveal" style="--d: 0.24s">
        <button id="open-settings">settings</button>
        <button id="open-app">open full timer&ensp;&#8599;</button>
      </footer>
    </main>

    <!-- Compact settings: durations and theme — behaviour toggles live in the full app. -->
    <main class="popup" id="settings-view" hidden>
      <header class="reveal">
        <span class="kicker">durations &middot; minutes</span>
        <h1 class="phase-word">settings</h1>
      </header>

      <div class="fields reveal" style="--d: 0.06s">
        <div class="field" data-setting="focusMin" data-min="1" data-max="90">
          <span>Focus</span>
          <div class="stepper">
            <button class="step" data-dir="-1">&minus;</button>
            <input class="value" type="text" inputmode="numeric" value="25" />
            <button class="step" data-dir="1">+</button>
          </div>
        </div>
        <div class="field" data-setting="shortBreakMin" data-min="1" data-max="60">
          <span>Short break</span>
          <div class="stepper">
            <button class="step" data-dir="-1">&minus;</button>
            <input class="value" type="text" inputmode="numeric" value="5" />
            <button class="step" data-dir="1">+</button>
          </div>
        </div>
        <div class="field" data-setting="longBreakMin" data-min="1" data-max="90">
          <span>Long break</span>
          <div class="stepper">
            <button class="step" data-dir="-1">&minus;</button>
            <input class="value" type="text" inputmode="numeric" value="15" />
            <button class="step" data-dir="1">+</button>
          </div>
        </div>
        <div class="field" data-setting="longBreakEvery" data-min="2" data-max="8">
          <span>Long break every</span>
          <div class="stepper">
            <button class="step" data-dir="-1">&minus;</button>
            <input class="value" type="text" inputmode="numeric" value="4" />
            <button class="step" data-dir="1">+</button>
          </div>
        </div>
      </div>

      <div class="theme-block reveal" style="--d: 0.1s">
        <span class="kicker">theme · <span id="theme-name">ember</span></span>
        <div class="themes" id="themes"></div>
      </div>

      <footer class="reveal" style="--d: 0.14s">
        <button id="close-settings">&larr;&ensp;back to timer</button>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
